# Configuration d'analyse SonarQube du lab J2-M1.
# Le jeton n'est jamais écrit ici : il arrive par -Dsonar.login, depuis un
# credential Jenkins ou une variable d'environnement.
sonar.projectKey=nordmail-api
sonar.projectName=NordMail API
sonar.projectVersion=2.0
sonar.sources=app
sonar.exclusions=app/tests/**
sonar.python.version=3.12
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=120
